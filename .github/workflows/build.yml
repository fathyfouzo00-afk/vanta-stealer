name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/vanta/stealer app/src/main/res
          mv AndroidManifest.xml app/src/main/
          mv *.kt app/src/main/java/com/vanta/stealer/
          echo "include ':app'" > settings.gradle
          echo "rootProject.name='VantaStealer'" >> settings.gradle

          # إنشاء ملف build.gradle للتطبيق
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.vanta.stealer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vanta.stealer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # إنشاء ملف build.gradle الرئيسي
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          echo "gradle.version=8.3" > gradle.properties

      - name: Build APK
        run: |
          gradle wrapper
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
